<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xasuusin Aakhiro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "1bacdf0d-3760-459b-8113-daf6819ab35c",
      serviceWorkerPath: "sw.js",
      serviceWorkerParam: { scope: "/" },
      notifyButton: { enable: false }
    });
  });
</script>
<style>
  :root{--bg:#0f2027;--bg2:#203a43;--bg3:#2c5364;--card:#ffffff10;--text:#f5f5f5;--accent:#d4af37;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(135deg,var(--bg),var(--bg2),var(--bg3));color:var(--text);padding:20px;}
  .card{max-width:560px;width:100%;background:var(--card);backdrop-filter:blur(8px);
    border:1px solid #ffffff22;border-radius:18px;padding:32px 26px;text-align:center;
    box-shadow:0 8px 32px #00000055;}
  h1{margin:0 0 6px;font-size:22px;color:var(--accent);}
  .clock{font-size:13px;opacity:.7;margin-bottom:18px;}
  .arabic{font-size:24px;line-height:1.9;margin:16px 0;direction:rtl;}
  .translation{font-size:16px;line-height:1.7;opacity:.9;margin-bottom:10px;}
  .source{font-size:13px;color:var(--accent);opacity:.85;}
  .speaking{font-size:13px;color:var(--accent);margin-top:14px;min-height:18px;}
  .btn{margin-top:16px;background:var(--accent);color:#1a1a1a;border:none;padding:10px 22px;
    border-radius:30px;font-weight:600;cursor:pointer;font-size:14px;margin-right:8px;}
  .btn.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent);}
  .status{font-size:12px;opacity:.6;margin-top:14px;}
  .menuBtn{position:fixed;top:16px;left:16px;z-index:20;background:#ffffff15;border:1px solid var(--accent);
    color:var(--accent);width:42px;height:42px;border-radius:10px;font-size:20px;cursor:pointer;}
  .overlay{position:fixed;inset:0;background:#00000080;z-index:30;display:none;}
  .overlay.open{display:block;}
  .panel{position:fixed;top:0;left:0;bottom:0;width:85%;max-width:360px;
    background:linear-gradient(160deg,var(--bg2),var(--bg3));z-index:31;
    padding:20px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s ease;
    padding-top:calc(20px + env(safe-area-inset-top,0px));}
  .overlay.open .panel{transform:translateX(0);}
  .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .panel-header h2{font-size:16px;color:var(--accent);margin:0;}
  .closeBtn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;}
  .settings{font-size:13px;text-align:left;}
  .settings h3{font-size:13px;color:var(--accent);margin:12px 0 6px;text-align:center;}
  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0;gap:8px;}
  .row label{opacity:.8;flex:1;}
  .row input[type=number]{width:70px;background:#ffffff15;color:var(--text);border:1px solid var(--accent);
    border-radius:8px;padding:6px 8px;font-size:13px;}
  .addForm textarea,.addForm input,.addForm select{width:100%;margin:4px 0;background:#ffffff15;
    color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:6px 8px;font-size:13px;
    box-sizing:border-box;}
  .addForm textarea{direction:rtl;min-height:50px;}
  .addForm .btn{width:100%;margin-top:8px;margin-right:0;}
  .customList{margin-top:10px;font-size:12px;}
  .customItem{display:flex;justify-content:space-between;align-items:center;
    background:#ffffff10;border-radius:8px;padding:6px 10px;margin:4px 0;}
  .customItem span{opacity:.85;}
  .customItem button{background:none;border:none;color:#e57373;cursor:pointer;font-size:14px;}
</style>
</head>
<body>
<button class="menuBtn" id="menuBtn">☰</button>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-header">
      <h2>⚙️ Settings</h2>
      <button class="closeBtn" id="closeBtn">✕</button>
    </div>
    <div class="settings">
      <div class="row">
        <label for="intervalInput">Daqiiqo kasta oo xasuusin dhacdo:</label>
        <input type="number" id="intervalInput" min="1" value="60">
      </div>
      <div class="row">
        <label for="ayahWeight">Miisaanka Aayadaha (0 = laga tag):</label>
        <input type="number" id="ayahWeight" min="0" value="1">
      </div>
      <div class="row">
        <label for="hadithWeight">Miisaanka Axaadiista (0 = laga tag):</label>
        <input type="number" id="hadithWeight" min="0" value="1">
      </div>

      <h3>➕ Ku dar Xasuusin gaar ah</h3>
      <div class="addForm">
        <select id="newType">
          <option value="ayah">Aayad</option>
          <option value="hadith">Xadiith</option>
        </select>
        <textarea id="newArabic" placeholder="Qoraalka Carabiga ah..."></textarea>
        <input type="text" id="newTranslation" placeholder="Turjumaadda Soomaaliga...">
        <input type="text" id="newSource" placeholder="Ilaha (tusaale: Suuratu al-Baqarah: 2)">
        <button class="btn" id="addBtn">Ku dar</button>
      </div>
      <div class="customList" id="customList"></div>
    </div>
  </div>
</div>

<div class="card">
  <h1>🌙 Xasuusin Aakhiro</h1>
  <div class="clock" id="clock"></div>
  <div class="arabic" id="arabic"></div>
  <div class="translation" id="translation"></div>
  <div class="source" id="source"></div>
  <div class="speaking" id="speaking"></div>
  <div>
    <button class="btn" id="nextBtn">Xasuusin xigta</button>
    <button class="btn secondary" id="enableBtn">Daar ogaysiisyada</button>
  </div>
  <div class="status" id="status">Ogaysiisyadu waa la damiyay — riix "Daar ogaysiisyada".</div>
</div>

<script>
document.getElementById('menuBtn').addEventListener('click', ()=> document.getElementById('overlay').classList.add('open'));
document.getElementById('closeBtn').addEventListener('click', ()=> document.getElementById('overlay').classList.remove('open'));
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') document.getElementById('overlay').classList.remove('open');
});

/* ===== Firebase (Realtime Database) — isku xidhka Apps Script-ka saacadda dhabta ah ===== */
const FIREBASE_URL = 'https://tijaabo-basas-default-rtdb.firebaseio.com';

/* ===== Liiska Xasuusinta — Aayado + Axaadiis ku saabsan Aakhiro ===== */
const reminders = [
  { type:'ayah', arabic:"يَا عَبْدَ اللَّهِ قَالَ اللَّهُ سُبْحَانَهُ وَتَعَالَى: كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ۗ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ الْقِيَامَةِ",
    translation:"Naf kastaa way dhadhamin doontaa geerida, oo waxaa laydinku oofin doonaa ajrigiinna Maalinta Qiyaamaha.",
    source:"Suuratu Aali-Cimraan: 185" },
  { type:'ayah', arabic:"يَا عَبْدَ اللَّهِ قَالَ اللَّهُ سُبْحَانَهُ وَتَعَالَى: مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً",
    translation:"Qofkii camal wanaagsan fala isagoo mu'min ah, lab ama dhedig ha noqdee, waxaan siin doonaa nolol wanaagsan.",
    source:"Suuratu An-Nahl: 97" },
  { type:'ayah', arabic:"يَا عَبْدَ اللَّهِ قَالَ اللَّهُ سُبْحَانَهُ وَتَعَالَى: فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ. وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ",
    translation:"Ruuxii xagga wanaag oo miisaan xabbad wadhaf ku oofiya wuu arki doonaa, ruuxii xumaanna la mid ahna wuu arki doonaa.",
    source:"Suuratu Az-Zalzalah: 7-8" },
  { type:'ayah', arabic:"يَا عَبْدَ اللَّهِ قَالَ اللَّهُ سُبْحَانَهُ وَتَعَالَى: وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَّا كَسَبَتْ",
    translation:"Ka dhawrsada maalin laydinku celin doono xagga Eebbe, dabadeedna naf kastaa waxaa loo oofin doonaa waxay kasbatay.",
    source:"Suuratu Al-Baqarah: 281" },
  { type:'ayah', arabic:"يَا عَبْدَ اللَّهِ قَالَ اللَّهُ سُبْحَانَهُ وَتَعَالَى: أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ",
    translation:"Ma waxaad u malaynaysaan inaan idiin abuurnay si aan micno lahayn, iyo inaydaan xaggayaga soo noqonayn?",
    source:"Suuratu Al-Mu'minuun: 115" },
  { type:'ayah', arabic:"يَا عَبْدَ اللَّهِ قَالَ اللَّهُ سُبْحَانَهُ وَتَعَالَى: يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْئًا ۖ وَالْأَمْرُ يَوْمَئِذٍ لِّلَّهِ",
    translation:"Maalintaas naf kasta uma hanato naf kale waxba, amarkuna maalintaas Eebbe uun baa leh.",
    source:"Suuratu Al-Infitaar: 19" },
  { type:'hadith', arabic:"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَكْثِرُوا ذِكْرَ هَاذِمِ اللَّذَّاتِ",
    translation:"Badiya xusuusta burinta raaxooyinka (geerida).",
    source:"Xadiith — Tirmidhi" },
  { type:'hadith', arabic:"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: مَا مِنْكُمْ مِنْ أَحَدٍ إِلَّا سَيُكَلِّمُهُ رَبُّهُ لَيْسَ بَيْنَهُ وَبَيْنَهُ تَرْجُمَانٌ",
    translation:"Midkiinna ma jiro oo Eebbahiis aan lala hadlayn, turjumaan dhexdiisa iyo Rabbigiis ma jiro.",
    source:"Xadiith — Bukhaari" },
  { type:'hadith', arabic:"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: إِذَا مَاتَ ابْنُ آدَمَ انْقَطَعَ عَمَلُهُ إِلَّا مِنْ ثَلَاثٍ: صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ",
    translation:"Marka ibnu-aadmigu dhinto, camalkiisu wuu go'aa, saddex arrimood mooyaane: sadaqo socota, cilmi la faa'iidaysto, ama ilmo suubban oo u ducaynaya.",
    source:"Xadiith — Muslim" },
  { type:'hadith', arabic:"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: الدُّنْيَا سِجْنُ الْمُؤْمِنِ وَجَنَّةُ الْكَافِرِ",
    translation:"Adduunyadu waa xabsiga mu'minka, waana jannada gaalka.",
    source:"Xadiith — Muslim" },
  { type:'hadith', arabic:"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ",
    translation:"Adduunyada ku noqo sidii qariib ama sidii mar-mar sac (mid u socda meel kale).",
    source:"Xadiith — Bukhaari" },
  { type:'hadith', arabic:"قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: حُفَّتِ الْجَنَّةُ بِالْمَكَارِهِ وَحُفَّتِ النَّارُ بِالشَّهَوَاتِ",
    translation:"Jannada waxaa ku xeeran arrimo naftu nacdo, naartana waxaa ku xeeran waxyaabo naftu jeceshahay.",
    source:"Xadiith — Muslim" }
];

const arabicEl=document.getElementById('arabic'), translationEl=document.getElementById('translation'),
      sourceEl=document.getElementById('source'), clockEl=document.getElementById('clock'),
      speakingEl=document.getElementById('speaking'), statusEl=document.getElementById('status'),
      intervalInput=document.getElementById('intervalInput'),
      ayahWeightInput=document.getElementById('ayahWeight'),
      hadithWeightInput=document.getElementById('hadithWeight'),
      customListEl=document.getElementById('customList');
let swReg=null, arabicVoice=null;

/* ---- Settings: interval + miisaanka ayah/hadith (persisted) ---- */
function getIntervalMinutes(){ return parseInt(localStorage.getItem('xasuusin_interval_min') || '60', 10); }
function getWeights(){
  return {
    ayah: parseFloat(localStorage.getItem('xasuusin_ayah_weight') ?? '1'),
    hadith: parseFloat(localStorage.getItem('xasuusin_hadith_weight') ?? '1')
  };
}
intervalInput.value = getIntervalMinutes();
ayahWeightInput.value = getWeights().ayah;
hadithWeightInput.value = getWeights().hadith;
intervalInput.addEventListener('change', ()=>{
  const v = Math.max(1, parseInt(intervalInput.value,10) || 60);
  intervalInput.value = v;
  localStorage.setItem('xasuusin_interval_min', v);
  fbPutSettings();
});
ayahWeightInput.addEventListener('change', ()=>{
  localStorage.setItem('xasuusin_ayah_weight', Math.max(0, parseFloat(ayahWeightInput.value)||0));
  fbPutSettings();
});
hadithWeightInput.addEventListener('change', ()=>{
  localStorage.setItem('xasuusin_hadith_weight', Math.max(0, parseFloat(hadithWeightInput.value)||0));
  fbPutSettings();
});

/* U dir Firebase settings-ka (interval + miisaanka) si Apps Script-ku isla isticmaalo */
function fbPutSettings(){
  const w = getWeights();
  fetch(FIREBASE_URL + '/reminders/settings.json', {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ intervalMinutes: getIntervalMinutes(), ayahWeight: w.ayah, hadithWeight: w.hadith })
  }).catch(()=>{});
}

/* ---- Xasuusinta gaarka ah ee user-ku daro ---- */
function loadCustom(){ return JSON.parse(localStorage.getItem('xasuusin_custom') || '[]'); }
function saveCustom(list){ localStorage.setItem('xasuusin_custom', JSON.stringify(list)); }

function getByType(type){
  const custom = loadCustom().filter(r=>r.type===type);
  return reminders.filter(r=>r.type===type).concat(custom);
}

function renderCustomList(){
  const list = loadCustom();
  customListEl.innerHTML = list.length ? '' : '<div style="opacity:.5">Weli lama darin xasuusin gaar ah.</div>';
  list.forEach((item, i)=>{
    const div = document.createElement('div');
    div.className='customItem';
    div.innerHTML = `<span>${item.type==='ayah'?'📖':'🗣️'} ${item.translation.slice(0,40)}${item.translation.length>40?'…':''}</span>`;
    const delBtn = document.createElement('button');
    delBtn.textContent='✕';
    delBtn.addEventListener('click', ()=>{
      const l = loadCustom(); l.splice(i,1); saveCustom(l); renderCustomList();
    });
    div.appendChild(delBtn);
    customListEl.appendChild(div);
  });
}
renderCustomList();

document.getElementById('addBtn').addEventListener('click', ()=>{
  const type = document.getElementById('newType').value;
  let arabic = document.getElementById('newArabic').value.trim();
  const translation = document.getElementById('newTranslation').value.trim();
  const source = document.getElementById('newSource').value.trim() || (type==='ayah' ? 'Aayad gaar ah' : 'Xadiith gaar ah');
  if(!arabic || !translation){ alert('Fadlan buuxi qoraalka Carabiga iyo turjumaadda.'); return; }
  const prefix = type==='ayah' ? 'يَا عَبْدَ اللَّهِ قَالَ اللَّهُ سُبْحَانَهُ وَتَعَالَى: ' : 'قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: ';
  if(!arabic.startsWith('يَا عَبْدَ اللَّهِ') && !arabic.startsWith('قَالَ رَسُولُ')) arabic = prefix + arabic;
  const list = loadCustom();
  list.push({type, arabic, translation, source});
  saveCustom(list);

  /* Sidoo kale u dir Firebase si Apps Script-ku (saacadda dhabta ah) uu u isticmaalo xasuusintan */
  const fbKey = 'c' + Date.now();
  fetch(FIREBASE_URL + '/reminders/library/' + fbKey + '.json', {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type, arabic, translation, source})
  }).catch(()=>{});

  document.getElementById('newArabic').value='';
  document.getElementById('newTranslation').value='';
  document.getElementById('newSource').value='';
  renderCustomList();
});

/* ---- Cod Carabi (Text-to-Speech) ---- */
function loadArabicVoice(){
  const voices = speechSynthesis.getVoices();
  arabicVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar')) || null;
}
if('speechSynthesis' in window){
  loadArabicVoice();
  speechSynthesis.onvoiceschanged = loadArabicVoice;
}
function speakArabic(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ar-SA';
  if(arabicVoice) utter.voice = arabicVoice;
  utter.rate = 0.85;
  utter.onstart = ()=> speakingEl.textContent = '🔊 Wuu akhrinayaa...';
  utter.onend = ()=> speakingEl.textContent = '';
  speechSynthesis.speak(utter);
}

/* ---- Weighted round-robin: aayado + axaadiis miisaan la doorto ---- */
function pickNextItem(){
  const w = getWeights();
  const ayahCount = parseFloat(localStorage.getItem('xasuusin_ayah_count') || '0');
  const hadithCount = parseFloat(localStorage.getItem('xasuusin_hadith_count') || '0');
  let type;
  if(w.ayah<=0 && w.hadith<=0) type='ayah';
  else if(w.ayah<=0) type='hadith';
  else if(w.hadith<=0) type='ayah';
  else type = (ayahCount / w.ayah <= hadithCount / w.hadith) ? 'ayah' : 'hadith';

  let list = getByType(type);
  if(list.length===0) list = getByType(type==='ayah'?'hadith':'ayah'); // fallback if one type is empty
  const ptrKey = 'xasuusin_'+type+'_ptr';
  const ptr = parseInt(localStorage.getItem(ptrKey) || '0', 10) % list.length;
  localStorage.setItem(ptrKey, (ptr+1) % list.length);
  localStorage.setItem('xasuusin_'+type+'_count', (type==='ayah'?ayahCount:hadithCount)+1);
  return list[ptr];
}

function displayItem(item, autoSpeak, notify){
  arabicEl.textContent=item.arabic; translationEl.textContent=item.translation; sourceEl.textContent=item.source;
  if(autoSpeak) speakArabic(item.arabic);
  localStorage.setItem('xasuusin_last_shown', JSON.stringify(item));
  localStorage.setItem('xasuusin_last_ts', Date.now());
  if(notify && swReg){
    swReg.active && swReg.active.postMessage({type:'SHOW_REMINDER', title:'Xasuusin Aakhiro', body:item.translation});
  }
}

function updateClock(){ clockEl.textContent=new Date().toLocaleTimeString('so-SO'); }

function checkAndUpdate(){
  const now = Date.now();
  const lastTs = parseInt(localStorage.getItem('xasuusin_last_ts') || '0', 10);
  const intervalMs = getIntervalMinutes() * 60000;
  if(now - lastTs >= intervalMs){
    displayItem(pickNextItem(), true, true);
  }
}

/* Hubi Firebase-ka (Apps Script-ku halkaas ayuu xasuusinta cusub ku qori doonaa) */
async function pollFirebase(){
  try{
    const res = await fetch(FIREBASE_URL + '/reminders/current.json');
    if(!res.ok) throw new Error('firebase-not-ok');
    const item = await res.json();
    if(item && item.arabic && item.ts){
      const lastSeenTs = parseInt(localStorage.getItem('xasuusin_firebase_last_ts') || '0', 10);
      if(item.ts !== lastSeenTs){
        localStorage.setItem('xasuusin_firebase_last_ts', item.ts);
        displayItem(item, true, true);
      }
    }
  } catch(err){
    checkAndUpdate(); // Firebase lama gaarin — isticmaal saacadda maxalliga ah
  }
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  displayItem(pickNextItem(), true, false);
});

document.getElementById('enableBtn').addEventListener('click', async ()=>{
  const perm = await Notification.requestPermission();
  statusEl.textContent = perm==='granted' ? '✅ Ogaysiisyada way shaqeynayaan.' : 'Ogaysiisyada waa la diiday.';
  if(perm==='granted' && window.OneSignalDeferred){
    OneSignalDeferred.push(async function(OneSignal){
      await OneSignal.User.PushSubscription.optIn();
    });
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    if(Notification.permission==='granted') statusEl.textContent='✅ Ogaysiisyada way shaqeynayaan.';
  });
}

updateClock();
const savedLast = localStorage.getItem('xasuusin_last_shown');
if(savedLast){
  const item = JSON.parse(savedLast);
  arabicEl.textContent=item.arabic; translationEl.textContent=item.translation; sourceEl.textContent=item.source;
} else {
  displayItem(pickNextItem(), false, false);
}
checkAndUpdate();
setInterval(updateClock,1000);
setInterval(pollFirebase,15000);
</script>
</body>
</html>
